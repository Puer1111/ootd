<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역 - OOTD</title>

    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <link rel="stylesheet" th:href="@{/css/common/main-header.css}">
    <link rel="stylesheet" th:href="@{/css/common/layout.css}">
    <link rel="stylesheet" th:href="@{/css/product/likedProducts.css}">

    <script src="/js/user/mypageNotLogin.js"></script>
</head>
<body>

<div id="auth-loading">
    <div class="loading-content">
        <div class="spinner"></div>
        <p>로그인 확인 중...</p>
    </div>
</div>

<header th:replace="~{common/main-header.html :: header}"></header>

<div class="liked-products-container">
    <div class="page-header">
        <h1 class="page-title">주문 내역</h1>
        <p class="page-subtitle">내가 주문한 상품들을 확인하세요</p>
        <div class="stats-info">
            <span class="total-count">총 <span id="total-count">0</span>개의 상품</span>
        </div>
    </div>

    <div id="loading-state" class="loading">
        <div class="spinner"></div>
        <p>주문 내역을 불러오는 중...</p>
    </div>

    <div id="products-container" style="display: none;">
        <div id="products-grid" class="products-grid">
        </div>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">📦</div>
        <h2 class="empty-title">주문한 상품이 없습니다</h2>
        <p class="empty-message">마음에 드는 상품을 주문해보세요!</p>
        <a href="/index" class="btn btn-primary">상품 둘러보기</a>
    </div>

    <div id="error-state" class="empty-state" style="display: none;">
        <div class="empty-icon">⚠️</div>
        <h2 class="empty-title">오류가 발생했습니다</h2>
        <p class="empty-message">주문 내역을 불러올 수 없습니다.</p>
        <button class="btn btn-primary" onclick="loadOrderHistory()">다시 시도</button>
    </div>

    <div class="back-button">
        <a href="/mypage" class="btn btn-outline">← 마이페이지로 돌아가기</a>
    </div>
</div>

<footer th:replace="~{common/footer.html :: footer}"></footer>

<script src="/js/user/orderHistory.js"></script>
<script src="/js/api/payment/payment.js"></script>

</body>
</html>
