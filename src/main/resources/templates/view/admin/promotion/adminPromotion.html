<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>추천 및 세일 관리 - OOTD Admin</title>
    <link rel="stylesheet" href="/css/common/admin/admin_footer.css">
    <link rel="stylesheet" href="/css/common/admin/admin_header.css">
    <link rel="stylesheet" href="/css/common/admin/admin_layout.css">
    <link rel="stylesheet" href="/css/common/reset.css">
    <link rel="stylesheet" href="/css/admin/adminPromotion.css">
</head>
<body>

<header th:replace="~{view/admin/css/admin_header :: admin_header}"></header>

<main class="admin-main">
    <aside class="admin-sidebar">
        <h2>관리자 메뉴</h2>
        <ul class="sidebar-menu">
            <li><a href="/admin/coupon" class="menu-link">쿠폰 관리</a></li>
            <li><a href="/admin/product" class="menu-link">상품 관리</a></li>
            <li><a href="/admin/promotion" class="menu-link active">추천 및 세일 관리</a></li>
        </ul>
    </aside>

    <div class="admin-content">
        <!-- 페이지 제목 -->
        <div class="page-header">
            <h1 class="page-title">
                <span class="title-icon">⭐</span>
                추천 및 세일 관리
            </h1>
        </div>

        <!-- 🆕 탭 네비게이션 -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="recommendation">
                <span class="tab-icon">⭐</span>
                추천 관리
            </button>
            <button class="tab-btn" data-tab="sale">
                <span class="tab-icon">🔥</span>
                세일 관리
            </button>
        </div>

        <!-- 🆕 추천 관리 탭 -->
        <div id="recommendation-tab" class="tab-content active">
            <div class="promotion-management-section">
                <div class="filter-section">
                    <div class="filter-group">
                        <label for="filter-type-recommend">필터:</label>
                        <select id="filter-type-recommend">
                            <option value="all">전체</option>
                            <option value="recommended">추천한 상품</option>
                            <option value="not-recommended">추천 안한 상품</option>
                        </select>
                    </div>
                    <div class="section-actions">
                        <button class="btn btn-primary" onclick="refreshProductList()">새로고침</button>
                    </div>
                </div>

                <table id="recommend-table" class="admin-table">
                    <thead>
                    <tr>
                        <th>상품번호</th>
                        <th>상품명</th>
                        <th>브랜드</th>
                        <th>추천 여부</th>
                        <th>추천 관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 상품 목록이 동적으로 추가됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 🆕 세일 관리 탭 -->
        <div id="sale-tab" class="tab-content">
            <div class="promotion-management-section">
                <div class="filter-section">
                    <div class="filter-group">
                        <label for="filter-type-sale">필터:</label>
                        <select id="filter-type-sale">
                            <option value="all">전체</option>
                            <option value="on-sale">세일 중</option>
                            <option value="not-on-sale">세일 안함</option>
                        </select>
                    </div>
                    <div class="section-actions">
                        <button class="btn btn-primary" onclick="refreshSaleProductList()">새로고침</button>
                    </div>
                </div>

                <table id="sale-table" class="admin-table">
                    <thead>
                    <tr>
                        <th>상품번호</th>
                        <th>상품명</th>
                        <th>브랜드</th>
                        <th>원가</th>
                        <th>세일 상태</th>
                        <th>세일 관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 세일 상품 목록이 동적으로 추가됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{view/admin/css/admin_footer :: admin_footer}"></footer>

<script src="/js/admin/adminPromotion.js"></script>
</body>
</html>
