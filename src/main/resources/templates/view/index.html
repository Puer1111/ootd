<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OOTD</title>

    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/main-header.css">
    <link rel="stylesheet" href="/css/common/layout.css">
    <link rel="stylesheet" href="/css/common/reset.css">
    <link rel="stylesheet" href="/css/main/main.css">
</head>
<body>

<header th:replace="~{common/main-header.html :: header}"></header>

<main>
    <div th:fragment="content">
        <div class="main-container">


            <div th:each="categoryEntry : ${productsByCategory}" class="section">
                <div class="section-header">
                    <h2 class="section-title" th:text="${categoryEntry.key}">카테고리명</h2>
                </div>

                <div class="carousel-container">
                    <button class="carousel-btn prev">‹</button>
                    <div class="grid-container products-grid">
                        <div th:each="product : ${categoryEntry.value}" class="card"
                             th:data-product-no="${product.productNo}"
                             onclick="goToProduct(this)">

                            <button class="like-btn-card"
                                    th:data-product-no="${product.productNo}"
                                    onclick="toggleLikeFromMain(event, this)">
                                <span class="heart">♡</span>
                            </button>

                            <div class="card-image">
                                <img th:if="${product.imageUrls != null and !product.imageUrls.isEmpty()}"
                                     th:src="${product.imageUrls[0]}"
                                     th:alt="${product.productName}">
                                <span th:if="${product.imageUrls == null or product.imageUrls.isEmpty()}">
                                    이미지 없음
                                </span>
                            </div>

                            <div class="card-content">
                                <div class="card-subtitle" th:text="${product.brandName}">브랜드명</div>
                                <div class="card-title" th:text="${product.productName}">상품명</div>
                                <div class="card-tag" th:text="${product.subCategory != null ? product.subCategory : '카테고리'}">카테고리</div>
                                <div class="card-price" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">
                                    가격
                                </div>
                                <div class="card-stats">
                                    <div class="stat-item">
                                        <span class="icon heart-icon">♥</span>
                                        <span th:text="${product.likeCount}">0</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="icon star-icon">★</span>
                                        <span th:text="'리뷰 ' + ${product.reviewCount} + '개'">리뷰 0개</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-btn next">›</button>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{common/footer.html :: footer}"></footer>

<script src="/js/main/main.js"></script>

</body>
</html>
