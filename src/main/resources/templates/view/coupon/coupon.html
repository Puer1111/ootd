<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>

    <title>OOTD</title>
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/header.css">

    <link rel="stylesheet" href="/css/common/reset.css">
    <link rel="stylesheet" href="/css/coupon/coupon.css">
</head>
<body>
<header th:replace="~{common/header :: header}"></header>

            <div class="coupon-image-area">

                <img src="/img/coupon/30퍼센트.png" alt="Coupon Image">
            </div>
            <button id="issue-coupon-btn" class="issue-coupon-button" data-coupon-id="2">쿠폰 받기</button>
        </div>
    </div>
</main>
<footer th:replace="~{common/footer :: footer}"></footer>
<script src="/js/user/auth.js"></script>
<script src="/js/api/coupon/couponAPI.js"></script>
</body>
</html>
