<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OOTD</title>
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/main-header.css">
    <link rel="stylesheet" href="/css/common/layout.css">
    <link rel="stylesheet" href="/css/common/reset.css">
    <link rel="stylesheet" href="/css/coupon/coupon.css">
</head>
<body>
<header th:replace="~{common/main-header :: header}"></header>
<main>
    <div th:fragment="content" style="background-color:lightgray">
        <div class="coupon-container">
            <div class="coupon-image-area">
                <!-- 여기에 쿠폰 이미지가 들어갈 예정 -->
                <img src="/img/coupon/30퍼센트.png" alt="Coupon Image">
            </div>
            <button id="issue-coupon-btn" class="issue-coupon-button" data-coupon-id="2">첫구매 30% 쿠폰 받기</button>
        </div>
        <hr style="background-color:lightgray; width:450px; position:relative; left:20px;">
        <div class="caution" style="padding:10px;">
            <p style="font-size:18px;">주의사항</p>
            <p style="font-size:15px;"> - 쿠폰은 상품단위로 사용가능하며 일부 상품의 경우 사용이 제한될 수 있습니다.</p>
            <p style="font-size:15px;"> - 지급된 쿠폰은 마이페이지에서 확인 가능합니다.</p>
        </div>
    </div>
    <button id="go-login-btn">가입하고 혜택받기</button>
</main>
<!--<footer th:replace="~{common/footer :: footer}"></footer>-->
<script src="/js/user/auth.js"></script>
<script src="/js/api/coupon/couponAPI.js"></script>
</body>
</html>
