<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header th:fragment="header">
    <nav id="logoUserSystem">
        <div class="nav">
            <div class="nav-left">
                <div id="header-logo">
                    <a href="/">OOTD</a>
                </div>
                <div class="category-area">
                    <a href="#" class="click-button_product">tops</a>
                    <a href="#" class="click-button_product">bottoms</a>
                    <a href="#" class="click-button_product">shoes</a>
                </div>
        </div>
            <div class="nav-right">
                <nav class="nav-menu">
                    <a href="/liked-products">좋아요</a>
                    <a href="/mypage">마이페이지</a>
                    <a href="/cart">장바구니</a>
                </nav>
            </div>
        </div>
    </nav>
    <div id="searchList">
        <div class="label">
            <input type="text" placeholder="검색어를 입력하세요." id ="search-input">
            <button class="searchButton">
                <img src="/img/common/search.png" alt="searchImg" id="search">
            </button>
        </div>
    </div>
    <div class="simpleSearchTerm">
        <!-- 🔥 추천 상품 페이지로 이동 -->
        <a href="/recommended" class="simpleSearch">
            <div class="searchTermDiv"><span class="searchTerm">추천</span></div>
        </a>
        <a href="/ranking" class="simpleSearch">
            <div class="searchTermDiv"><span class="searchTerm">랭킹</span></div>
        </a>
        <!-- 🔥 세일 상품 페이지로 이동 -->
        <a href="/sale" class="simpleSearch">
            <div class="searchTermDiv"><span class="searchTerm">세일</span></div>
        </a>
    </div>
</header>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 현재 페이지 URL 확인
        const currentPath = window.location.pathname;
        const tabs = document.querySelectorAll('.simpleSearch');

        // 모든 탭에서 active 클래스 제거
        tabs.forEach(tab => tab.classList.remove('active'));

        // 현재 페이지에 해당하는 탭 활성화
        if (currentPath === '/main') {
            document.querySelector('.simpleSearch[data-tab="main"]').classList.add('active');
        } else if (currentPath === '/recommended') {
            document.querySelector('.simpleSearch[data-tab="recommended"]').classList.add('active');
        } else if (currentPath === '/ranking') {
            document.querySelector('.simpleSearch[data-tab="ranking"]').classList.add('active');
        } else if (currentPath === '/sale') {
            document.querySelector('.simpleSearch[data-tab="sale"]').classList.add('active');
        } else if (currentPath === '/') {
            // 루트 경로일 때는 추천 탭 활성화 (기본값)
            document.querySelector('.simpleSearch[data-tab="recommended"]').classList.add('active');
        }

        // 탭 클릭 이벤트 (즉시 피드백)
        tabs.forEach(tab => {
            tab.addEventListener('click', function(e) {
                // 클릭된 탭 즉시 활성화 (페이지 로딩 전 시각적 피드백)
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });
    });
</script>
</body>
</html>
